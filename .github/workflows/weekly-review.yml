name: Weekly UX evidence review
on:
  schedule:
    - cron: '30 1 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: mileage-data
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/weekly_review.py
      - name: Save proposals only
        run: |
          git config user.name 'miles-intelligence[bot]'
          git config user.email 'miles-intelligence[bot]@users.noreply.github.com'
          git add docs/data/weekly-review.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update weekly UX review proposals'
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
